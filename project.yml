name: SignalVeil
options:
  bundleIdPrefix: com.cyan0914
  deploymentTarget:
    iOS: "16.0"
  minimumXcodeGenVersion: 2.40
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.14.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: H4VQ9X6KYK
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_CFBundleDisplayName: "SignalVeil"
    INFOPLIST_KEY_UILaunchScreenGeneration: "Default"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_LSRequiresIPhoneOS: YES
    INFOPLIST_KEY_UIApplicationSceneManifest: >
      {"UIApplicationSupportsMultipleScenes": false}
    INFOPLIST_KEY_UIRequiredDeviceCapabilities: ["arm64"]
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  SignalVeil:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - ".git/"
          - ".github/"
          - "**/.gitkeep"
          - "README.md"
          - "上架材料/"
          - "ExportOptions.plist"
          - "Resources/SignalVeil.entitlements"
    settings:
      base:
        PRODUCT_NAME: SignalVeil
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.clearsignal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/SignalVeil.entitlements
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Injected at build time (CI: GitHub Secrets → xcodebuild APP_SECRET=...).
        # Never committed — this only wires the placeholder into Info.plist.
        APP_SECRET: $(APP_SECRET)
      configs:
        Release: {}
    dependencies:
      - package: RevenueCat
